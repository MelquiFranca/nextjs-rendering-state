services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stale_data_detective
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stale_data_detective"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - stale-data-postgres:/var/lib/postgresql/data
      - ./database/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro

volumes:
  stale-data-postgres:
